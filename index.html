<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AhsanApps - Clear Accent Waitlist</title>
    <!-- GitHub Pages deployment -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- AhsanApps Logo -->
        <div class="logo-container fade-in">
            <img src="AhsanAppsLogo.png" alt="AhsanApps Logo" class="company-logo">
        </div>

        <!-- Waitlist Text -->
        <h1 class="waitlist-text fade-in-delay-1">Join the waitlist of my next app now!</h1>

        <!-- App Card -->
        <div class="app-card fade-in-delay-2">
            <div class="app-icon-container">
                <img src="logo.png" alt="Clear Accent App Icon" class="app-icon">
            </div>
            <div class="app-info">
                <h2 class="app-name">Clear Accent</h2>
                <p class="app-tagline">Train Your Corporate Voice</p>
            </div>
            <a href="https://ahsan-apps.com/clearAccent" class="join-button" target="_blank" rel="noopener noreferrer">
                Join Waitlist →
            </a>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
